<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OASIS Menu｜福岡工業大学 学生食堂</title>
  <meta name="description" content="福岡工業大学 学生食堂オアシスのメニューとアレルギー情報（多言語対応）">
  <meta name="theme-color" content="#001242">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23001242'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='16' font-weight='700' fill='%2301a2e6'%3EO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <nav class="nav" aria-label="main">
        <a href="#menu" data-i18n="nav_menu">メニュー</a>
        <a href="#filter" data-i18n="nav_filter">絞り込み</a>
        <a href="#info" data-i18n="nav_info">ご案内</a>
      </nav>
      <a class="wordmark" href="#top">OASIS<small>FIT CAFETERIA</small></a>
      <label class="lang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span class="visually-hidden" data-i18n="language">言語</span>
        <select id="lang"></select>
      </label>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="wrap hero__grid">
        <div>
          <h1 class="hero__title"><span id="hero-title">OASIS</span>MENU</h1>
          <p class="hero__sub" id="hero-sub"></p>
          <div class="hero__actions">
            <a class="btn btn--fill" href="#menu" data-i18n="hero_cta">メニューを見る</a>
            <a class="btn btn--ghost" href="#filter" data-i18n="hero_cta2">アレルギーで絞り込む</a>
          </div>
        </div>
        <div class="hero__media" id="hero-media" hidden></div>
      </div>
    </section>

    <div class="notice" id="notice" hidden>
      <div class="wrap notice__inner">
        <span class="notice__label" data-i18n="notice">お知らせ</span>
        <p class="notice__text" id="notice-text"></p>
      </div>
    </div>

    <div class="panel">
      <section class="section wrap" id="filter" aria-labelledby="filter-title">
        <p class="eyebrow">Filter</p>
        <h2 class="section-title" id="filter-title" data-i18n="filter_title">食べられるメニューを探す</h2>
        <p class="section-lead" data-i18n="filter_lead"></p>

        <div class="filter">
          <fieldset class="filter__group">
            <legend data-i18n="filter_diet">宗教・食習慣</legend>
            <div class="toggles" id="diet-toggles"></div>
          </fieldset>
          <fieldset class="filter__group">
            <legend data-i18n="filter_allergy">アレルゲン・食材</legend>
            <div class="toggles" id="allergen-toggles"></div>
          </fieldset>
          <div class="filter__row">
            <label class="check"><input type="checkbox" id="strict" checked><span data-i18n="filter_strict"></span></label>
            <button type="button" class="link-btn" id="clear" data-i18n="clear">条件をクリア</button>
          </div>
          <p class="diet-note" data-i18n="diet_note"></p>
        </div>
      </section>

      <section class="section wrap" id="menu" aria-labelledby="menu-title" style="padding-top:0">
        <p class="eyebrow">Menu</p>
        <h2 class="section-title" id="menu-title" data-i18n="nav_menu">メニュー</h2>
        <div class="toolbar">
          <div class="tabs" role="tablist" id="tabs"></div>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span class="visually-hidden" data-i18n="search"></span>
            <input type="search" id="q" autocomplete="off">
          </label>
        </div>
        <p class="count" id="count" aria-live="polite"></p>
        <div id="results"><p class="loading" data-i18n="loading">読み込み中…</p></div>
      </section>
    </div>

    <section class="info" id="info">
      <div class="wrap">
        <p class="eyebrow">Information</p>
        <h2 class="section-title" data-i18n="nav_info">ご案内</h2>
        <div class="info__grid">
          <div>
            <h3 data-i18n="disclaimer">アレルギーについて</h3>
            <p id="disclaimer"></p>
            <div class="legend" id="legend"></div>
          </div>
          <div id="hours-block" hidden>
            <h3 data-i18n="hours">営業時間</h3>
            <p id="hours"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>OASIS — <span data-i18n="footer_fit">福岡工業大学 学生食堂</span></span>
      <span>© Fukuoka Institute of Technology</span>
    </div>
  </footer>

  <button class="to-top" id="to-top" type="button">
    <span class="visually-hidden" data-i18n="back_top">ページ上部へ</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <dialog class="dialog" id="detail" aria-labelledby="detail-name"></dialog>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
